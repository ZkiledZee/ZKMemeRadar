name: Build IPA
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Apple-signed IPA with push (requires signing secrets)"
        type: boolean
        default: false
  push:
    paths: ['ZKMemeRadar-Source.zip', '.github/workflows/build.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: radar-build-source
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.zk.memeradar' }}
      SIGNED: ${{ inputs.signed || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded source ZIP
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import stat, zipfile
          archive = Path("ZKMemeRadar-Source.zip")
          if not archive.is_file():
              raise SystemExit("Upload ZKMemeRadar-Source.zip to the repository root, without extracting or renaming it.")
          target = Path("radar-build-source")
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              if sum(i.file_size for i in z.infolist()) > 100_000_000:
                  raise SystemExit("Source archive is unexpectedly large")
              for i in z.infolist():
                  path = Path(i.filename)
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(i.external_attr >> 16):
                      raise SystemExit("Unsafe archive path")
              if z.testzip() is not None:
                  raise SystemExit("Corrupt source ZIP; upload it again")
              z.extractall(target)
          for name in ["ios/project.yml", "scripts/simulator.py", "scripts/check_ipa.py"]:
              if not (target / name).is_file():
                  raise SystemExit("Missing project file: " + name)
          print("Source ZIP extracted and validated")
          PY
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild -version
      - name: Compile and test in simulator
        run: |
          DEVICE_ID=$(python3 scripts/simulator.py)
          xcodebuild test -project ios/ZKMemeRadar.xcodeproj -scheme ZKMemeRadar \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/Tests CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/TestResults.xcresult
      - name: Build unsigned sideload IPA
        if: env.SIGNED != 'true'
        run: |
          xcodebuild build -project ios/ZKMemeRadar.xcodeproj -scheme ZKMemeRadar \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" RADAR_PUSH_ENABLED=NO
          mkdir -p build/package/Payload
          cp -R build/Device/Build/Products/Release-iphoneos/ZKMemeRadar.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../ZKMemeRadar.ipa Payload
      - name: Install signing assets
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: python3 scripts/install_signing.py
      - name: Archive and export push-enabled IPA
        if: env.SIGNED == 'true'
        run: |
          xcodebuild archive -project ios/ZKMemeRadar.xcodeproj -scheme ZKMemeRadar \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/ZKMemeRadar.xcarchive PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$SIGNING_TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            RADAR_PUSH_ENABLED=YES APS_ENVIRONMENT=production
          xcodebuild -exportArchive -archivePath build/ZKMemeRadar.xcarchive \
            -exportPath build/Export -exportOptionsPlist build/ExportOptions.plist
          cp build/Export/ZKMemeRadar.ipa build/ZKMemeRadar.ipa
      - name: Validate IPA contents
        run: python3 scripts/check_ipa.py build/ZKMemeRadar.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ZKMemeRadar-IPA
          path: radar-build-source/build/ZKMemeRadar.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Test-Results
          path: radar-build-source/build/TestResults.xcresult
          if-no-files-found: ignore
      - name: Remove signing assets
        if: always() && env.SIGNED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/radar-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/radar.mobileprovision"
          rm -f "$RUNNER_TEMP/radar.p12" "$RUNNER_TEMP/radar.mobileprovision"
